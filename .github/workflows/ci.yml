name: CI

on:
  push:
    branches: [main]
  pull_request:

# Gate the standalone SEO-APP repo on tests + lint + schema validity. The app lives at the repo root
# here (this file ships via `git subtree push --prefix=app/pixelify-seo seo-app main`), so no working
# directory is needed. Tests mock Prisma + fetch, so no database or network is required — DATABASE_URL
# is a throwaway that only satisfies `prisma validate`/`generate`'s env("DATABASE_URL").
env:
  DATABASE_URL: postgresql://ci:ci@localhost:5432/ci

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install
        run: npm ci

      - name: Prisma client + schema
        run: |
          npx prisma generate
          npx prisma validate

      - name: Lint
        run: npm run lint

      - name: Test (with coverage gate)
        run: npm run test:coverage

      # The unit suite mocks Prisma and fetch, so it can only prove the SOURCE behaves. This builds the
      # bundle we actually ship and boots it, which is the only thing that catches a production-only
      # failure (e.g. remix-serve's fetch polyfill having no static Response.json — green in dev and in
      # tests, 500 in production). No database needed: we assert the server starts and serves HTTP.
      - name: Build
        run: npm run build

      - name: Smoke (built server boots)
        run: npm run smoke
